name: Build VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: ninja-build/setup-ninja@v1

    - name: Download JUCE
      run: |
        git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build VST3 Plugin
      run: |
        cmake --build build --config Release --target TolibjonProduction_VST3

    - name: Upload VST3 Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tolibjon-Vocal-Strip-VST3
        path: build/TolibjonProduction_artefacts/Release/VST3/
